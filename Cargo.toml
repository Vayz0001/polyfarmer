[package]
name = "polyfarmer"
version = "0.1.0"
edition = "2021"
description = "Self-hosted bot that farms LP rewards on Polymarket. Your keys never leave your machine."
license = "MIT"
repository = "https://github.com/Vayz0001/polyfarmer"

[dependencies]
# ── Polymarket V2 CLOB SDK (official) ─────────────────────────────────────────
# V2 cutover (Apr 28 2026) made V1 SDKs dead. `clob` feature required (default = []).
# `gamma` adds the typed Gamma metadata client (market/event resolution by slug) —
# used to resolve a pasted Polymarket URL without hand-rolled JSON parsing.
# alloy/reqwest are PINNED to the versions this SDK expects — do NOT bump majors.
polymarket_client_sdk_v2 = { version = "0.7.0", features = ["clob", "gamma"] }

# ── Async runtime + networking ────────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }            # pinned by SDK
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

# ── Ethereum signing ──────────────────────────────────────────────────────────
alloy = { version = "1.0", features = ["signer-local"] }       # pinned by SDK

# ── Numbers, time, serde ──────────────────────────────────────────────────────
rust_decimal = { version = "1.36", features = ["serde"] }
rust_decimal_macros = "1.36"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

# ── Web dashboard (axum + askama + embedded assets) ───────────────────────────
# Shares hyper 1 / http 1 / tower 0.5 with the SDK tree — no version conflict.
axum = "0.8"
askama = "0.16"                # compile-time templates, auto-escaping (XSS-safe)
tower-http = { version = "0.6", default-features = false, features = ["catch-panic"] }  # contain handler panics (was: unused brotli/trace features)
rust-embed = "8.11"           # bake templates + static assets into the binary
mime_guess = "2"              # content-types for embedded assets
tower-sessions = "0.15"       # cookie sessions (login state, CSRF token)

# ── Auth + credential encryption ──────────────────────────────────────────────
argon2 = "0.6"                # password hashing (login) — OWASP standard, RustCrypto
chacha20poly1305 = "0.10"     # AEAD to encrypt the wallet key at rest, RustCrypto
rand = "0.8"                  # secure RNG (salts, nonces, master key, tokens)

# ── Config, secrets, errors, logging ──────────────────────────────────────────
dotenvy = "0.15"
secrecy = "0.10"
async-trait = "0.1"      # implement tower-sessions' SessionStore for our bounded store
time = "0.3"             # session expiry timestamps (already a transitive dependency)
zeroize = { version = "1", features = ["serde"] }  # wipe key material from memory when dropped
eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
# process hardening (no core dumps / ptrace) and umask in tests; already a transitive dependency
libc = "0.2"

[dev-dependencies]
# router testing via oneshot (no network bind needed)
tower = { version = "0.5", features = ["util"] }
