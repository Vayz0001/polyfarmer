[package]
name = "polyfarmer"
version = "0.1.1"
edition = "2021"
description = "Self-hosted bot that farms LP rewards on Polymarket. Your keys never leave your machine."
license = "MIT"
repository = "https://github.com/Vayz0001/polyfarmer"

[dependencies]
# ── Polymarket V2 CLOB SDK (official) ─────────────────────────────────────────
# V2 cutover (Apr 28 2026) made V1 SDKs dead. `clob` feature required (default = []).
# `gamma` adds the typed Gamma metadata client (market/event resolution by slug) —
# used to resolve a pasted Polymarket URL without hand-rolled JSON parsing.
# alloy is PINNED to the major this SDK uses (one shared copy) — do NOT bump it
# apart from the SDK. The SDK brings its own reqwest 0.13; ours below is separate.
polymarket_client_sdk_v2 = { version = "0.7.0", features = ["clob", "gamma"] }

# ── Async runtime + networking ────────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }            # ours; the SDK uses 0.13 (both are built). Moving to 0.13 needs the owner's OK
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures-util = "0.3"

# ── Ethereum signing ──────────────────────────────────────────────────────────
alloy = { version = "1.0", features = ["signer-local"] }       # pinned by SDK

# ── Numbers, time, serde ──────────────────────────────────────────────────────
rust_decimal = { version = "1.36", features = ["serde"] }
rust_decimal_macros = "1.36"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

# ── Web dashboard (axum + askama + embedded assets) ───────────────────────────
# Shares hyper 1 / http 1 / tower 0.5 with the SDK tree — no version conflict.
axum = "0.8"
askama = "0.16"                # compile-time templates, auto-escaping (XSS-safe)
tower-http = { version = "0.7", default-features = false, features = ["catch-panic"] }  # contain handler panics
rust-embed = "8.11"           # bake static assets into the binary
mime_guess = "2"              # content-types for embedded assets
tower-sessions = "0.15"       # cookie sessions (login state, CSRF token)

# ── Auth + credential encryption ──────────────────────────────────────────────
argon2 = "0.6"                # password hashing (login) — OWASP standard, RustCrypto
chacha20poly1305 = "0.11"     # AEAD to encrypt the wallet key at rest, RustCrypto
rand = "0.10"                 # secure RNG (salts, nonces, master key, tokens)

# ── Config, secrets, errors, logging ──────────────────────────────────────────
dotenvy = "0.15"
secrecy = "0.10"
async-trait = "0.1"      # implement tower-sessions' SessionStore for our bounded store
time = "0.3"             # session expiry timestamps (already a transitive dependency)
zeroize = { version = "1", features = ["serde"] }  # wipe key material from memory when dropped
eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
flate2 = "1"             # unpack the gzipped PolyRewards leaderboard (rewards rank)

[target.'cfg(unix)'.dependencies]
# process hardening (no core dumps / ptrace) and umask in tests; already a transitive dependency
libc = "0.2"

[dev-dependencies]
# router testing via oneshot (no network bind needed)
tower = { version = "0.5", features = ["util"] }
# paused clock for backoff tests (same tokio, test builds only)
tokio = { version = "1", features = ["test-util"] }

# Examples' tests don't run by default; this makes `cargo test` (and so ./check and CI) run the preview's.
[[example]]
name = "serve"
test = true

# `unsafe` is denied everywhere; the few places that need raw libc calls carry a
# narrow #[allow(unsafe_code)] with the reason. The clippy lints below are denied for all
# code outside tests (clippy.toml lets tests unwrap, expect, panic and print); the demo
# example has one documented #![expect] for printing. See AGENTS.md.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
