{% extends "base_card.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
<p class="lead">Enter your dashboard password.</p>
<form class="stack" method="post" action="/login">
  <input type="hidden" name="csrf" value="{{ csrf_token }}" />
  <div class="field"><label class="label" for="password">Password</label><input class="input" type="password" id="password" name="password" autocomplete="current-password" autofocus required /></div>
  {% if let Some(err) = error %}<div class="alert err">{{ err }}</div>{% endif %}
  <button class="btn primary block" type="submit">Sign in</button>
</form>
{% endblock %}
