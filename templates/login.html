<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>polyfarmer · sign in</title>
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <main class="wrap">
    <form class="card stack" method="post" action="/login">
      <div class="brand"><span class="logo">P</span> polyfarmer</div>
      <input type="hidden" name="csrf" value="{{ csrf_token }}" />
      <label class="lbl">Password</label>
      <input class="inp" type="password" name="password" autofocus required />
      <button class="btn" type="submit">Sign in</button>
      {% if let Some(err) = error %}<div class="err">{{ err }}</div>{% endif %}
    </form>
  </main>
</body>
</html>
