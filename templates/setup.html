<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>polyfarmer · setup</title>
  <link rel="stylesheet" href="/assets/app.css" />
  <script src="/assets/htmx.min.js" defer></script>
  <script>
    // Pure client-side format check — instant, no network round-trip.
    // A private key is exactly 64 hex chars, optionally 0x-prefixed.
    // 'partial' covers a key that's still being typed/pasted (or edited
    // down to nothing) — it's not wrong yet, so we stay quiet rather than
    // flashing "invalid" on every keystroke.
    function pfKeyState(v) {
      const body = v.trim().replace(/^0[xX]/, '');
      if (body.length === 0) return 'empty';
      if (!/^[0-9a-fA-F]*$/.test(body)) return 'invalid';
      if (body.length < 64) return 'partial';
      if (body.length === 64) return 'complete';
      return 'invalid';
    }
    function pfKeyLooksValid(v) {
      return pfKeyState(v) === 'complete';
    }
    function pfToggleKeyVisibility(btn) {
      const el = document.getElementById('private_key');
      const show = el.type === 'password';
      el.type = show ? 'text' : 'password';
      btn.classList.toggle('is-shown', show);
      btn.setAttribute('aria-label', show ? 'Hide private key' : 'Show private key');
      btn.setAttribute('aria-pressed', show ? 'true' : 'false');
    }
    function pfOnKeyInput(el) {
      const state = pfKeyState(el.value);
      const status = document.getElementById('wallet-detect-status');
      const wrap = document.getElementById('wallet-field-wrap');
      if (state !== 'complete') {
        wrap.classList.add('pf-collapse');
        wrap.classList.remove('pf-expand');
      }
      // No entrance animation here on purpose — these are transient,
      // instant, client-only states. The one animated moment is reserved
      // for the server-confirmed result swapped in below.
      if (state === 'empty' || state === 'partial') {
        status.innerHTML = '';
      } else if (state === 'invalid') {
        status.innerHTML = '<div class="muted" style="margin-top:6px">Invalid private key</div>';
      } else {
        status.innerHTML = '<div class="muted" style="margin-top:6px">Checking on-chain…</div>';
      }
    }
  </script>
</head>
<body>
  <main class="wrap">
    <div class="card setup">
      <div class="setup-head">
        <div class="brand"><span class="logo">P</span> polyfarmer <span class="v">setup</span></div>
        <form method="post" action="/logout">
          <button class="icon-btn" type="submit" aria-label="Log out">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
          </button>
        </form>
      </div>

      {% if let Some(n) = notice %}<div class="ok">{{ n }}</div>{% endif %}
      {% if let Some(e) = error %}<div class="err">{{ e }}</div>{% endif %}

      <form class="stack section" method="post" action="/setup/wallet"
            hx-post="/setup/wallet" hx-target="#save-region" hx-swap="innerHTML">
        <div class="lbl-row">
          <label class="h" for="private_key">Private Key</label>
          <span id="key-badge">{% if has_wallet %}<span class="ok-inline">✓ configured</span>{% endif %}</span>
        </div>
        <input type="hidden" name="csrf" value="{{ csrf_token }}" />
        <div class="inp-wrap">
          <input class="inp" type="password" name="private_key" id="private_key" placeholder="0x…" required
                 maxlength="66" oninput="pfOnKeyInput(this)" style="padding-right:42px"
                 hx-post="/setup/wallet/detect" hx-trigger="input changed delay:150ms[pfKeyLooksValid(this.value)]"
                 hx-target="#wallet-detect-status" hx-swap="innerHTML" />
          <button type="button" class="inp-action" aria-label="Show private key" aria-pressed="false" onclick="pfToggleKeyVisibility(this)">
            <svg class="ico-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="ico-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
          </button>
        </div>
        <div id="wallet-detect-status"></div>
        <div id="wallet-field-wrap" class="pf-collapse">
          <div class="lbl-row">
            <label class="h" for="proxy_wallet">Wallet Address</label>
          </div>
          <input class="inp" type="text" name="proxy_wallet" id="proxy_wallet"
                 placeholder="0x…" required />
        </div>
        <p class="muted">Private, encrypted, never leaves your device.</p>
        <div id="save-region">
          <button class="btn" type="submit">Save</button>
        </div>
      </form>

      <div class="row">
        <a class="btn ghost" href="/">← Dashboard</a>
      </div>
    </div>
  </main>
</body>
</html>
