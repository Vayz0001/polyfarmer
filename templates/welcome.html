{% extends "base_card.html" %}
{% block title %}Welcome{% endblock %}
{% block content %}
<h1>Welcome</h1>
<p class="lead">Create a password to protect this dashboard. Next you'll add your wallet.</p>
<form class="stack" method="post" action="/welcome">
  <input type="hidden" name="csrf" value="{{ csrf_token }}" />
  <div class="field"><label class="label" for="password">New password <span class="hint">8+ characters</span></label><input class="input" type="password" id="password" name="password" autocomplete="new-password" minlength="8" autofocus required /></div>
  <div class="field"><label class="label" for="confirm">Confirm password</label><input class="input" type="password" id="confirm" name="confirm" autocomplete="new-password" minlength="8" required /></div>
  {% if let Some(err) = error %}<div class="alert err">{{ err }}</div>{% endif %}
  <button class="btn primary block" type="submit">Create password</button>
</form>
{% endblock %}
