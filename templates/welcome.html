<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>polyfarmer · welcome</title>
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <main class="wrap">
    <form class="card stack" method="post" action="/welcome">
      <div class="brand"><span class="logo">▲</span> polyfarmer</div>
      <p class="muted">Welcome — create an admin password to secure your dashboard.</p>
      <input type="hidden" name="csrf" value="{{ csrf_token }}" />
      <label class="lbl">New password</label>
      <input class="inp" type="password" name="password" placeholder="At least 8 characters" autofocus required />
      <input class="inp" type="password" name="confirm" placeholder="Confirm password" required />
      <button class="btn" type="submit">Create account</button>
      {% if let Some(err) = error %}<div class="err">{{ err }}</div>{% endif %}
    </form>
  </main>
</body>
</html>
