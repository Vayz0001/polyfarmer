<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>polyfarmer · market</title>
  <link rel="stylesheet" href="/assets/app.css" />
  <script src="/assets/htmx.min.js" defer></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="logo">P</span> polyfarmer</div>
      <nav class="nav">
        <a href="/"><span class="ic">&#9676;</span> Overview</a>
        <a href="/markets" class="active"><span class="ic">&#8801;</span> Markets</a>
        <a href="/rewards"><span class="ic">&#9733;</span> Rewards</a>
        <a href="/setup"><span class="ic">&#9881;</span> Setup</a>
      </nav>
      <div class="spacer"></div>
      <div class="side-foot">
        self-hosted &middot; keys never leave your machine
        <form method="post" action="/logout" style="margin-top:10px">
          <button class="btn ghost sm" type="submit">Log out</button>
        </form>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <h1>Market</h1>
        <a class="btn ghost" href="/markets">&larr; Markets</a>
      </header>

      <div class="content">
        <div class="err pf-rise">{{ message }}</div>
        <p class="muted">Try <a href="/markets/browse">browsing reward-eligible markets</a> or pasting the URL again.</p>
      </div>
    </div>
  </div>
</body>
</html>
