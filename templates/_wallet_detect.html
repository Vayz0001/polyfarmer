<div id="wallet-field-wrap" hx-swap-oob="true" class="{% if reveal %}pf-expand{% else %}pf-collapse{% endif %}">
  <div class="lbl-row">
    <label class="h" for="proxy_wallet">Wallet Address</label>
    {% if verified %}<span class="ok-inline">✓ Verified</span>{% endif %}
  </div>
  <input class="inp" type="text" name="proxy_wallet" id="proxy_wallet"
         value="{% if reveal %}{{ value }}{% endif %}"
         placeholder="0x…" required />
</div>
{% if !message.is_empty() %}
<div class="pf-rise muted" style="margin-top:6px">{{ message }}</div>
{% endif %}
{% if !candidates.is_empty() %}
<div class="pf-rise" style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
  {% for c in candidates %}
  <button type="button" class="btn ghost sm"
          onclick="document.getElementById('proxy_wallet').value='{{ c }}'">{{ c }}</button>
  {% endfor %}
</div>
{% endif %}
