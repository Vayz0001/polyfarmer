<div id="wallet-field-wrap" hx-swap-oob="true" class="{% if reveal %}pf-rise{% else %}pf-collapse{% endif %}">
  <label class="label" for="proxy_wallet">Polymarket wallet address {% if verified %}<span class="pill ok">Found on-chain</span>{% endif %}</label>
  <input class="input mono" type="text" name="proxy_wallet" id="proxy_wallet" value="{% if reveal %}{{ value }}{% endif %}" placeholder="0x…" required />
</div>
{% if !message.is_empty() %}<div class="help pf-rise">{{ message }}</div>{% endif %}
{% if !candidates.is_empty() %}
<div class="cand-list pf-rise">
  {% for c in candidates %}
  <button type="button" class="btn sm mono" data-action="pick-wallet" data-addr="{{ c }}">{{ c }}</button>
  {% endfor %}
</div>
{% endif %}
