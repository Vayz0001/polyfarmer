<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>polyfarmer · browse markets</title>
  <link rel="stylesheet" href="/assets/app.css" />
  <script src="/assets/htmx.min.js" defer></script>
</head>
<body>
  <div class="app">
    {% include "_sidebar.html" %}

    <div class="main">
      <header class="topbar">
        <h1>Browse reward-eligible markets</h1>
        <a class="btn ghost" href="/markets">&larr; Markets</a>
      </header>

      <div class="content">
        <form id="browse-form" class="row" style="gap:10px;margin-top:0"
              hx-get="/markets/browse/results" hx-target="#browse-results" hx-swap="innerHTML"
              hx-trigger="input changed delay:300ms from:#browse-q, change from:#browse-sort, change from:#browse-dir">
          <input class="inp" type="text" name="q" id="browse-q" placeholder="Search markets&hellip;" value="{{ q }}" style="flex:1" />
          <select class="inp" name="sort" id="browse-sort" style="width:auto">
            <option value="rate_per_day" selected={{ sort == "rate_per_day" }}>Daily pool</option>
            <option value="spread" selected={{ sort == "spread" }}>Tightest spread</option>
            <option value="volume_24hr" selected={{ sort == "volume_24hr" }}>24h volume</option>
            <option value="competitiveness" selected={{ sort == "competitiveness" }}>Least crowded</option>
          </select>
          <select class="inp" name="dir" id="browse-dir" style="width:auto">
            <option value="DESC" selected={{ dir == "DESC" }}>High to low</option>
            <option value="ASC" selected={{ dir == "ASC" }}>Low to high</option>
          </select>
        </form>

        <div id="browse-results" class="panel" style="margin-top:18px"
             hx-get="/markets/browse/results?sort={{ sort }}&dir={{ dir }}" hx-trigger="load" hx-swap="innerHTML">
          <div class="empty">Loading&hellip;</div>
        </div>
      </div>
    </div>
  </div>
  {% include "_toasts.html" %}
</body>
</html>
