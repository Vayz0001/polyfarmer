<div class="kpis">
  {% for k in kpis %}
  <div class="kpi">
    <div class="k">{{ k.label }}</div>
    <div class="v{% if k.pos %} pos{% endif %}">{{ k.value }}</div>
    <div class="s">{{ k.sub }}{% if let Some(t) = k.time %} <time class="pf-local" datetime="{{ t.iso }}"{% if t.with_date %} data-date{% endif %}>{{ t.utc }}</time>{% endif %}</div>
  </div>
  {% endfor %}
  <div class="kpi">
    <div class="k">Rewards rank{% if let Some(t) = rank.tier %} <span class="tag accent">{{ t }}</span>{% endif %}</div>
    <div class="v">{{ rank.value }}</div>
    <div class="s">{{ rank.sub }} · <a href="{{ rank.link }}" target="_blank" rel="noopener noreferrer" title="PolyRewards ranks every wallet that has earned Polymarket liquidity rewards by rewards earned. Your address is never sent to it.">PolyRewards ↗</a></div>
  </div>
</div>
