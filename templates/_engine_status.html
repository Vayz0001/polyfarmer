{% if running %}
<div id="engine-status"><p class="ok-inline" style="margin-top:0">✓ Trading is live</p></div>
{% else if failed %}
<div id="engine-status"><p class="warn-inline" style="margin-top:0">Couldn't start automatically — check the logs, then re-save to retry.</p></div>
{% else %}
<div id="engine-status" hx-get="/setup/engine-status" hx-trigger="load delay:1000ms" hx-swap="outerHTML">
  <p class="muted" style="margin-top:0">Starting the bot…</p>
</div>
{% endif %}
