<div id="pf-toasts" class="toast-wrap" aria-live="polite"></div>
<script>
(function () {
  if (window.pfSSE) return; // init once per page
  function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }
  function relTime(iso) {
    var t = new Date(iso).getTime(); if (isNaN(t)) return "";
    var s = Math.max(0, (Date.now() - t) / 1000);
    if (s < 60) return Math.floor(s) + "s ago";
    if (s < 3600) return Math.floor(s / 60) + "m ago";
    if (s < 86400) return Math.floor(s / 3600) + "h ago";
    return Math.floor(s / 86400) + "d ago";
  }
  window.pfRelTime = function () {
    document.querySelectorAll(".act-time[data-ts]").forEach(function (el) {
      var iso = el.getAttribute("data-ts");
      el.textContent = relTime(iso);
      el.title = new Date(iso).toLocaleString();
    });
  };
  function dismiss(el) { el.classList.remove("show"); setTimeout(function () { el.remove(); }, 250); }
  function toast(a) {
    var wrap = document.getElementById("pf-toasts"); if (!wrap) return;
    var el = document.createElement("div");
    el.className = "toast tone-" + (a.tone || "pos");
    el.innerHTML =
      '<button class="toast-x" aria-label="Dismiss">&times;</button>' +
      '<span class="toast-cat">' + esc(a.category) + '</span>' +
      '<span class="toast-msg">' + esc((a.message || "").split("\n")[0]) + '</span>';
    el.querySelector(".toast-x").onclick = function (e) { e.stopPropagation(); dismiss(el); };
    el.onclick = function () { dismiss(el); };
    wrap.appendChild(el);
    requestAnimationFrame(function () { el.classList.add("show"); });
    var ttl = a.level === "error" ? 12000 : 6000;
    setTimeout(function () { dismiss(el); }, ttl);
  }
  function feedRow(a) {
    var row = document.createElement("div");
    row.className = "act-row " + a.level + " tone-" + (a.tone || "pos");
    row.setAttribute("data-cat", a.category);
    row.innerHTML =
      '<span class="act-dot"></span>' +
      '<div class="act-body"><div class="act-top">' +
      '<span class="act-cat">' + esc(a.category) + '</span>' +
      '<span class="act-time" data-ts="' + esc(a.ts) + '"></span></div>' +
      '<div class="act-msg">' + esc(a.message) + '</div></div>';
    return row;
  }
  function prependFeed(a) {
    // Live-prepend into every feed surface: the /activity page and the
    // floating Alerts window both carry class `pf-feed`.
    document.querySelectorAll(".pf-feed").forEach(function (feed) {
      var empty = feed.querySelector(".act-empty"); if (empty) empty.remove();
      var first = feed.firstElementChild;
      if (!first || !first.classList.contains("act-day") || first.getAttribute("data-day") !== "Today") {
        var d = document.createElement("div");
        d.className = "act-day"; d.setAttribute("data-day", "Today"); d.textContent = "Today";
        feed.insertBefore(d, feed.firstChild);
      }
      feed.querySelector('.act-day[data-day="Today"]').insertAdjacentElement("afterend", feedRow(a));
    });
    if (window.pfApplyActFilter) window.pfApplyActFilter();
  }
  var es = new EventSource("/activity/stream");
  window.pfSSE = es;
  es.addEventListener("alert", function (e) {
    var a; try { a = JSON.parse(e.data); } catch (_) { return; }
    toast(a); prependFeed(a); window.pfRelTime();
    if (window.pfAlertBump) window.pfAlertBump(a);
  });
  window.pfRelTime();
  setInterval(window.pfRelTime, 30000);
})();
</script>

<!-- Floating, draggable, resizable Alerts window + bottom dock launcher.
     Non-modal: the rest of the page stays usable. Position/size persist. -->
<button id="pf-dock" class="pf-dock" type="button" aria-label="Alerts">
  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
  Alerts
  <span id="pf-dock-badge" class="pf-dock-badge" hidden>0</span>
</button>
<div id="pf-alerts-win" class="pf-win" hidden>
  <div class="pf-win-bar" id="pf-win-bar">
    <span class="pf-win-title">Alerts</span>
    <a class="pf-win-all" href="/activity">View all</a>
    <button class="pf-win-x" id="pf-win-x" type="button" aria-label="Close">&times;</button>
  </div>
  <div class="pf-win-body pf-feed" id="pf-win-feed"></div>
</div>
<script>
(function () {
  if (window.pfDockInit) return; window.pfDockInit = true;
  var dock = document.getElementById("pf-dock");
  var win = document.getElementById("pf-alerts-win");
  var bar = document.getElementById("pf-win-bar");
  var feed = document.getElementById("pf-win-feed");
  var badge = document.getElementById("pf-dock-badge");
  var xbtn = document.getElementById("pf-win-x");
  var unread = 0, loaded = false;

  function save() {
    localStorage.setItem("pfWin", JSON.stringify({
      open: !win.hidden, left: win.style.left, top: win.style.top,
      w: win.style.width, h: win.style.height
    }));
  }
  function clampIntoView() {
    var r = win.getBoundingClientRect();
    if (r.left > window.innerWidth - 60) win.style.left = (window.innerWidth - 60) + "px";
    if (r.top > window.innerHeight - 40) win.style.top = (window.innerHeight - 40) + "px";
    if (r.left < 0) win.style.left = "8px";
    if (r.top < 0) win.style.top = "8px";
  }
  function ensurePos() {
    if (win.style.left) return;
    var w = win.offsetWidth || 340, h = win.offsetHeight || 380;
    win.style.left = Math.max(8, window.innerWidth - w - 24) + "px";
    win.style.top = Math.max(8, window.innerHeight - h - 84) + "px";
  }
  function loadFeed() {
    if (loaded) return; loaded = true;
    fetch("/activity/recent").then(function (r) { return r.text(); }).then(function (html) {
      feed.innerHTML = html; if (window.pfRelTime) window.pfRelTime();
    }).catch(function () { loaded = false; });
  }
  function open() {
    win.hidden = false; ensurePos(); clampIntoView(); loadFeed();
    unread = 0; badge.hidden = true; badge.textContent = "0";
    dock.classList.add("active"); save();
  }
  function close() { win.hidden = true; dock.classList.remove("active"); save(); }
  dock.onclick = function () { win.hidden ? open() : close(); };
  xbtn.onclick = close;

  try {
    var s = JSON.parse(localStorage.getItem("pfWin") || "{}");
    if (s.left) win.style.left = s.left; if (s.top) win.style.top = s.top;
    if (s.w) win.style.width = s.w; if (s.h) win.style.height = s.h;
    if (s.open) open();
  } catch (_) {}

  // Drag by the title bar.
  var dragging = false, ox = 0, oy = 0;
  bar.addEventListener("mousedown", function (e) {
    if (e.target === xbtn || e.target.closest("a")) return;
    dragging = true;
    var r = win.getBoundingClientRect();
    ox = e.clientX - r.left; oy = e.clientY - r.top;
    win.style.left = r.left + "px"; win.style.top = r.top + "px";
    document.body.style.userSelect = "none"; e.preventDefault();
  });
  document.addEventListener("mousemove", function (e) {
    if (!dragging) return;
    win.style.left = (e.clientX - ox) + "px";
    win.style.top = (e.clientY - oy) + "px";
  });
  document.addEventListener("mouseup", function () {
    if (dragging) { dragging = false; document.body.style.userSelect = ""; clampIntoView(); save(); }
  });
  if (window.ResizeObserver) new ResizeObserver(function () { if (!win.hidden) save(); }).observe(win);

  // Badge only warn/error (severity-weighted — avoids the "attention tax"
  // of counting routine info events).
  window.pfAlertBump = function (a) {
    if (!win.hidden) return;
    if (a.tone === "caution" || a.tone === "err" || a.level === "warn" || a.level === "error") {
      unread++; badge.textContent = unread > 99 ? "99+" : unread; badge.hidden = false;
    }
  };
})();
</script>

<!-- In-app confirm dialog: replaces htmx's native window.confirm for any
     element with hx-confirm. Survives the 2s table refresh (the request
     continuation is captured on click). -->
<div id="pf-modal" class="modal-overlay" hidden>
  <div class="modal-card" role="alertdialog" aria-modal="true">
    <p class="modal-q" id="pf-modal-q"></p>
    <div class="modal-actions">
      <button type="button" class="btn ghost sm" id="pf-modal-cancel">Cancel</button>
      <button type="button" class="btn danger sm" id="pf-modal-ok">Confirm</button>
    </div>
  </div>
</div>
<script>
(function () {
  if (window.pfModalInit) return; window.pfModalInit = true;
  var overlay = document.getElementById("pf-modal");
  var q = document.getElementById("pf-modal-q");
  var ok = document.getElementById("pf-modal-ok");
  var cancel = document.getElementById("pf-modal-cancel");
  var pending = null;
  function close() { overlay.hidden = true; pending = null; }
  document.addEventListener("htmx:confirm", function (e) {
    if (!e.detail.question) return;      // no hx-confirm → let htmx proceed
    e.preventDefault();                  // suppress the native window.confirm
    q.textContent = e.detail.question;
    pending = e.detail;
    overlay.hidden = false;
    ok.focus();
  });
  ok.onclick = function () { if (pending) { var d = pending; close(); d.issueRequest(true); } };
  cancel.onclick = close;
  overlay.onclick = function (e) { if (e.target === overlay) close(); };
  document.addEventListener("keydown", function (e) { if (!overlay.hidden && e.key === "Escape") close(); });
})();
</script>
