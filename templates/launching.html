{% extends "base_card.html" %}
{% block title %}Starting{% endblock %}
{% block content %}
<div class="launch" id="launch">
  <div class="spinner" aria-hidden="true"></div>
  <p class="launch-msg" id="launch-msg" aria-live="polite">Authenticating with Polymarket…</p>
  <a class="muted" href="/">Open dashboard now →</a>
  <div id="engine-status" hx-get="/setup/engine-status" hx-trigger="load delay:600ms" hx-swap="outerHTML" hidden></div>
</div>
{% endblock %}
{% block scripts %}
<script>
  (function () {
    var msgs = ["Authenticating with Polymarket…", "Clearing stale orders…", "Connecting to the order book…", "Almost there…"];
    var el = document.getElementById("launch-msg"), i = 0;
    var t = setInterval(function () { i = Math.min(i + 1, msgs.length - 1); el.textContent = msgs[i]; }, 1800);
    document.body.addEventListener("htmx:afterSwap", function () {
      if (document.querySelector("[data-launch-failed]")) { clearInterval(t); document.getElementById("launch").classList.add("failed"); }
    });
  })();
</script>
{% endblock %}
