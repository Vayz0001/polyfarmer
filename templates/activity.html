{% extends "base.html" %}
{% block title %}Activity{% endblock %}
{% block content %}
<div class="page-head">
  <div><h1>Activity</h1><div class="sub">Everything the engine did, newest first — streams live.</div></div>
</div>
<section class="panel">
  <div class="panel-head">
    <div class="filters" id="act-level">
      <button type="button" class="chip selected" data-action="filter" data-kind="level" data-value="all">All</button>
      <button type="button" class="chip" data-action="filter" data-kind="level" data-value="warn">Warnings</button>
      <button type="button" class="chip" data-action="filter" data-kind="level" data-value="error">Errors</button>
    </div>
    <div class="filters" id="act-cat">
      <button type="button" class="chip selected" data-action="filter" data-kind="cat" data-value="all">Any type</button>
      <button type="button" class="chip" data-action="filter" data-kind="cat" data-value="order">Orders</button>
      <button type="button" class="chip" data-action="filter" data-kind="cat" data-value="market">Markets</button>
      <button type="button" class="chip" data-action="filter" data-kind="cat" data-value="connection">Connection</button>
      <button type="button" class="chip" data-action="filter" data-kind="cat" data-value="engine">Engine</button>
    </div>
  </div>
  <div id="activity-feed" class="feed pf-feed">
    {% include "_activity_feed.html" %}
  </div>
</section>
{% endblock %}
