{% if saved %}
<div class="alert ok pf-rise"><svg class="i"><use href="#i-check"/></svg><span>Wallet saved (encrypted). Restart the bot to switch the trading wallet.</span></div>
<span id="key-badge" hx-swap-oob="true"><span class="pill ok">Configured</span></span>
{% else %}
<div class="alert err pf-rise" style="margin-bottom:10px">{{ message }}</div>
<button class="btn primary" type="submit">Save wallet</button>
{% endif %}
