{% if saved %}
<button class="btn btn-ok pf-rise" type="button" aria-disabled="true">✓ Saved</button>
<p class="muted pf-rise" style="margin-top:0">Restart the bot to switch wallets.</p>
<span id="key-badge" hx-swap-oob="true"><span class="ok-inline">✓ configured</span></span>
{% else %}
<div class="err pf-rise">{{ message }}</div>
<button class="btn" type="submit">Save</button>
{% endif %}
