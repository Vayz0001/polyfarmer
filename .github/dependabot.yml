# Dependabot opens pull requests for outdated dependencies and for new security
# advisories, so updates are reviewed and tested by CI instead of waiting for
# someone to remember to run `cargo update`.

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch and minor bumps arrive as one PR instead of a dozen.
      cargo-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # We share the SDK's alloy major; bumping alloy or the SDK alone breaks the
      # build or pulls in a second copy, so they move together, by hand. reqwest is
      # not tied to the SDK (ours is 0.12, the SDK's 0.13): moving ours is a
      # separate change the owner approves, not an automatic PR.
      - dependency-name: "alloy*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "reqwest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "polymarket_client_sdk_v2"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
