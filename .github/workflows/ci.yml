# Continuous integration: every push and pull request must build, pass the tests
# and lints, and keep the dependency policy (deny.toml) green. A weekly run
# re-checks the dependencies against the RustSec advisory database, so a newly
# published advisory turns this red even if nobody has pushed.
#
# Third-party actions are pinned to full commit hashes (a tag can be moved to
# malicious code, a hash cannot); Dependabot proposes updates to the pins.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:

# Read-only token for every job; nothing here needs to write to the repository.
permissions:
  contents: read

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: Format, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Formatting
        run: cargo fmt --all --check

      # --locked: fail if Cargo.lock is out of date instead of silently changing it.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

  # The same build, lints and tests on the other systems we support. Kept as its own job
  # (not a matrix on the one above) so the required check name above never changes.
  platforms:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal --component clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The runner image has NASM installed; a fresh Windows machine does not. Remove it and rebuild the
      # crypto library, so this job proves the build works the way a new user's does (see .cargo/config.toml).
      - name: Remove NASM (behave like a fresh Windows machine)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command nasm -All -ErrorAction SilentlyContinue | ForEach-Object { Remove-Item -LiteralPath $_.Source -Force }
          if (Get-Command nasm -ErrorAction SilentlyContinue) { throw "nasm is still on PATH" }
          cargo clean -p aws-lc-sys

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

  dependencies:
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Advisories, licenses, banned/duplicate crates and allowed sources, as
      # configured in deny.toml. The action's default `--all-features` would also
      # check optional crates we never compile, so the arguments are overridden.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --locked
