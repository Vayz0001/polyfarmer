# Continuous integration: every push and pull request must build, pass the tests
# and lints, and keep the dependency policy (deny.toml) green. A weekly run
# re-checks the dependencies against the RustSec advisory database, so a newly
# published advisory turns this red even if nobody has pushed.
#
# Third-party actions are pinned to full commit hashes (a tag can be moved to
# malicious code, a hash cannot); Dependabot proposes updates to the pins.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:

# Read-only token for every job; nothing here needs to write to the repository.
permissions:
  contents: read

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: Format, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false

      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Pinned release, checked against its published SHA-256 before it runs.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && sudo mv gitleaks /usr/local/bin/ && rm gitleaks.tgz

      # The same script contributors and agents run locally: formatting, clippy -D warnings,
      # cargo test --locked, shellcheck and gitleaks. (cargo-deny runs in its own job below.)
      - name: ./check
        run: ./check

  # The same build, lints and tests on the other systems we support. Kept as its own job
  # (not a matrix on the one above) so the required check name above never changes.
  platforms:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal --component clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The runner image has NASM installed; a fresh Windows machine does not. Remove it and rebuild the
      # crypto library, so this job proves the build works the way a new user's does (see .cargo/config.toml).
      - name: Remove NASM (behave like a fresh Windows machine)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command nasm -All -ErrorAction SilentlyContinue | ForEach-Object { Remove-Item -LiteralPath $_.Source -Force }
          if (Get-Command nasm -ErrorAction SilentlyContinue) { throw "nasm is still on PATH" }
          cargo clean -p aws-lc-sys

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

  dependencies:
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Advisories, licenses, banned/duplicate crates and allowed sources, as
      # configured in deny.toml. The action's default `--all-features` would also
      # check optional crates we never compile, so the arguments are overridden.
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          command: check
          arguments: --locked
